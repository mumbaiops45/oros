<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" fill="none">
  <defs>
    <linearGradient id="a" x1="80" y1="60" x2="340" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DDF0F6"/>
      <stop offset="1" stop-color="#8FCFE2"/>
    </linearGradient>
    <linearGradient id="b" x1="120" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B6E1EE"/>
    </linearGradient>
    <pattern id="layers" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="1.4" fill="#1E7793" opacity="0.14"/>
    </pattern>
    <clipPath id="cv"><path d="M150 128c-16 36-24 84-11 120 8 22 58 22 66 0 13-36 5-84-11-120z"/></clipPath>
  </defs>

  <circle cx="210" cy="180" r="146" fill="#37A6CA" opacity="0.10"/>
  <ellipse cx="210" cy="304" rx="150" ry="22" fill="#1E7793" opacity="0.10"/>

  <!-- hero vase -->
  <path d="M150 128c-16 36-24 84-11 120 8 22 58 22 66 0 13-36 5-84-11-120z" fill="url(#a)"/>
  <g clip-path="url(#cv)"><rect x="128" y="120" width="106" height="146" fill="url(#layers)"/></g>
  <ellipse cx="172" cy="128" rx="22" ry="7" fill="#FFFFFF"/>
  <ellipse cx="172" cy="128" rx="13" ry="4" fill="#1E7793" opacity="0.3"/>

  <!-- planter -->
  <path d="M248 196h72l-11 78a8 8 0 0 1-8 7h-34a8 8 0 0 1-8-7z" fill="url(#b)"/>
  <rect x="242" y="184" width="84" height="18" rx="9" fill="#FFFFFF"/>
  <path d="M284 184c-18-4-28-18-27-38 19 1 31 14 32 34z" fill="#8FCFE2"/>
  <path d="M286 182c2-22 15-35 35-36 1 21-12 35-31 38z" fill="#B6E1EE"/>

  <!-- articulated toy -->
  <path d="M92 272c12-4 15-18 8-28-7-11 3-23 15-20" stroke="url(#a)" stroke-width="22"
        stroke-linecap="round" fill="none"/>
  <path d="M92 272c12-4 15-18 8-28-7-11 3-23 15-20" stroke="#0B4256" stroke-width="22"
        stroke-dasharray="2 8" opacity="0.18" fill="none"/>

  <!-- price / discount chip -->
  <g transform="translate(268 84)">
    <rect width="98" height="44" rx="16" fill="#FFFFFF"/>
    <text x="49" y="29" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700"
          fill="#1E7793" text-anchor="middle">-30%</text>
  </g>
</svg>
