<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" fill="none">
  <defs>
    <linearGradient id="card" x1="60" y1="60" x2="360" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE9F1"/>
    </linearGradient>
    <linearGradient id="soft" x1="120" y1="40" x2="300" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A9DBEA"/>
    </linearGradient>
  </defs>

  <circle cx="210" cy="180" r="150" fill="#FFFFFF" opacity="0.12"/>

  <!-- dashboard card -->
  <rect x="66" y="80" width="288" height="204" rx="26" fill="url(#card)"/>
  <rect x="66" y="80" width="288" height="52" rx="26" fill="#FFFFFF"/>
  <circle cx="104" cy="106" r="15" fill="#37A6CA" opacity="0.35"/>
  <rect x="130" y="98" width="94" height="9" rx="4.5" fill="#9FD5E6"/>
  <rect x="130" y="112" width="58" height="7" rx="3.5" fill="#CFE7EF"/>

  <!-- saved model rows -->
  <g>
    <rect x="90" y="150" width="112" height="52" rx="14" fill="#FFFFFF"/>
    <path d="M126 164c-7 14-11 32-5 44 4 9 24 9 28 0 6-12 2-30-5-44z" fill="#8FCFE2"/>
    <rect x="216" y="150" width="112" height="52" rx="14" fill="#FFFFFF"/>
    <rect x="248" y="164" width="48" height="30" rx="8" fill="#8FCFE2"/>
  </g>

  <!-- reorder progress bar -->
  <rect x="90" y="220" width="238" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="90" y="220" width="150" height="14" rx="7" fill="#37A6CA" opacity="0.55"/>
  <rect x="90" y="248" width="120" height="9" rx="4.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- floating avatar badge -->
  <g transform="translate(322 88)">
    <circle r="42" fill="url(#soft)"/>
    <circle cy="-10" r="14" fill="#2A8AA9" opacity="0.45"/>
    <path d="M-20 22a20 20 0 0 1 40 0z" fill="#2A8AA9" opacity="0.45"/>
  </g>

  <!-- reward chip -->
  <g transform="translate(80 268)">
    <rect width="128" height="42" rx="21" fill="#FFFFFF"/>
    <circle cx="26" cy="21" r="12" fill="#37A6CA"/>
    <rect x="48" y="12" width="62" height="8" rx="4" fill="#9FD5E6"/>
    <rect x="48" y="25" width="40" height="7" rx="3.5" fill="#CFE7EF"/>
  </g>
</svg>
