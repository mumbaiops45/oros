<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" fill="none">
  <defs>
    <linearGradient id="g1" x1="60" y1="80" x2="460" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DFF1F7"/>
      <stop offset="1" stop-color="#9CD3E5"/>
    </linearGradient>
    <linearGradient id="g2" x1="120" y1="140" x2="300" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BCE3EF"/>
    </linearGradient>
    <pattern id="layers" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="1.5" fill="#1E7793" opacity="0.14"/>
    </pattern>
    <clipPath id="c1"><path d="M126 168c-20 46-30 110-14 156 10 28 76 28 86 0 16-46 6-110-14-156z"/></clipPath>
    <clipPath id="c2"><rect x="238" y="228" width="120" height="98" rx="18"/></clipPath>
  </defs>

  <ellipse cx="260" cy="396" rx="208" ry="26" fill="#0B4256" opacity="0.20"/>

  <!-- centre vase -->
  <path d="M126 168c-20 46-30 110-14 156 10 28 76 28 86 0 16-46 6-110-14-156z" fill="url(#g1)"/>
  <g clip-path="url(#c1)"><rect x="100" y="160" width="130" height="180" fill="url(#layers)"/></g>
  <ellipse cx="155" cy="168" rx="29" ry="9" fill="#FFFFFF"/>
  <ellipse cx="155" cy="168" rx="18" ry="5" fill="#1E7793" opacity="0.35"/>

  <!-- enclosure / prototype box -->
  <rect x="238" y="228" width="120" height="98" rx="18" fill="url(#g2)"/>
  <g clip-path="url(#c2)"><rect x="238" y="222" width="120" height="110" fill="url(#layers)"/></g>
  <rect x="238" y="212" width="120" height="26" rx="13" fill="#FFFFFF"/>
  <rect x="262" y="284" width="34" height="12" rx="4" fill="#7FC3D8"/>
  <rect x="306" y="284" width="22" height="12" rx="4" fill="#7FC3D8"/>

  <!-- gear -->
  <g transform="translate(400 250)">
    <g fill="url(#g1)">
      <circle r="58"/>
      <rect x="-8" y="-70" width="16" height="20" rx="3"/>
      <rect x="-8" y="50" width="16" height="20" rx="3"/>
      <rect x="-70" y="-8" width="20" height="16" rx="3"/>
      <rect x="50" y="-8" width="20" height="16" rx="3"/>
      <g transform="rotate(45)">
        <rect x="-8" y="-70" width="16" height="20" rx="3"/>
        <rect x="-8" y="50" width="16" height="20" rx="3"/>
        <rect x="-70" y="-8" width="20" height="16" rx="3"/>
        <rect x="50" y="-8" width="20" height="16" rx="3"/>
      </g>
    </g>
    <circle r="20" fill="#1E7793" opacity="0.45"/>
    <circle r="10" fill="#0B4256" opacity="0.4"/>
  </g>

  <!-- little articulated print -->
  <path d="M78 330c14-4 18-20 10-32-8-14 4-28 18-24" stroke="url(#g1)" stroke-width="26"
        stroke-linecap="round" fill="none"/>
  <path d="M78 330c14-4 18-20 10-32-8-14 4-28 18-24" stroke="#0B4256" stroke-width="26"
        stroke-dasharray="2 9" opacity="0.20" fill="none"/>

  <!-- figurine -->
  <g transform="translate(210 300)">
    <circle cy="-38" r="18" fill="url(#g2)"/>
    <path d="M-22-16h44l10 60h-64z" fill="url(#g2)"/>
    <ellipse cy="46" rx="38" ry="11" fill="#FFFFFF"/>
  </g>

  <!-- floating nozzle laying a bead of filament -->
  <g transform="translate(298 108)">
    <rect x="-34" y="-30" width="68" height="44" rx="12" fill="#FFFFFF"/>
    <path d="M-12 14h24l-7 22h-10z" fill="#DFF1F7"/>
    <path d="M-4 36h8l-3 12h-2z" fill="#9CD3E5"/>
    <path d="M0 52c-30 14-58 12-80 30" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="2 12" fill="none" opacity="0.85"/>
  </g>
</svg>
