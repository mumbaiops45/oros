<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <defs>
    <linearGradient id="steel" x1="70" y1="110" x2="250" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FD8EB"/>
      <stop offset="0.5" stop-color="#4AA8CC"/>
      <stop offset="1" stop-color="#1D6683"/>
    </linearGradient>
    <linearGradient id="steel2" x1="180" y1="200" x2="270" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CFE9F4"/>
      <stop offset="1" stop-color="#5FB4D4"/>
    </linearGradient>
    <pattern id="layers" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="1.3" fill="#FFFFFF" opacity="0.22"/>
    </pattern>
    <clipPath id="cp"><circle cx="140" cy="196" r="92"/></clipPath>
  </defs>

  <ellipse cx="160" cy="350" rx="90" ry="14" fill="#0F172A" opacity="0.10"/>

  <!-- small idler gear behind -->
  <g transform="translate(224 262)">
    <g fill="url(#steel2)">
      <circle r="44"/>
      <rect x="-7" y="-54" width="14" height="18" rx="3"/>
      <rect x="-7" y="36" width="14" height="18" rx="3"/>
      <rect x="-54" y="-7" width="18" height="14" rx="3"/>
      <rect x="36" y="-7" width="18" height="14" rx="3"/>
      <rect x="-40" y="-40" width="14" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-40" y="22" width="14" height="18" rx="3" transform="rotate(45)"/>
    </g>
    <circle r="15" fill="#1D6683"/>
  </g>

  <!-- main gear -->
  <g transform="translate(140 196)">
    <g fill="url(#steel)">
      <circle r="84"/>
      <rect x="-11" y="-100" width="22" height="26" rx="4"/>
      <rect x="-11" y="74" width="22" height="26" rx="4"/>
      <rect x="-100" y="-11" width="26" height="22" rx="4"/>
      <rect x="74" y="-11" width="26" height="22" rx="4"/>
      <g transform="rotate(45)">
        <rect x="-11" y="-100" width="22" height="26" rx="4"/>
        <rect x="-11" y="74" width="22" height="26" rx="4"/>
        <rect x="-100" y="-11" width="26" height="22" rx="4"/>
        <rect x="74" y="-11" width="26" height="22" rx="4"/>
      </g>
    </g>
  </g>
  <g clip-path="url(#cp)"><rect x="48" y="104" width="184" height="184" fill="url(#layers)"/></g>

  <!-- hub + lightening holes -->
  <circle cx="140" cy="196" r="46" fill="#FFFFFF" opacity="0.20"/>
  <circle cx="140" cy="196" r="28" fill="#12546E"/>
  <circle cx="140" cy="196" r="16" fill="#0B3B4E"/>
  <circle cx="140" cy="140" r="11" fill="#12546E" opacity="0.8"/>
  <circle cx="140" cy="252" r="11" fill="#12546E" opacity="0.8"/>
  <circle cx="84" cy="196" r="11" fill="#12546E" opacity="0.8"/>
  <circle cx="196" cy="196" r="11" fill="#12546E" opacity="0.8"/>
  <path d="M76 150a84 84 0 0 1 46-40" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.35" fill="none"/>
</svg>
