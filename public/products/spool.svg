<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <defs>
    <linearGradient id="flange" x1="60" y1="90" x2="260" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F6FA"/>
      <stop offset="1" stop-color="#B4C2D0"/>
    </linearGradient>
    <linearGradient id="fil" x1="90" y1="120" x2="230" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AE0F4"/>
      <stop offset="0.5" stop-color="#37A6CA"/>
      <stop offset="1" stop-color="#175C74"/>
    </linearGradient>
  </defs>

  <ellipse cx="160" cy="352" rx="86" ry="14" fill="#0F172A" opacity="0.10"/>

  <!-- back flange -->
  <circle cx="160" cy="210" r="118" fill="#94A5B6"/>

  <!-- wound filament -->
  <circle cx="160" cy="210" r="104" fill="url(#fil)"/>
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.22" fill="none">
    <circle cx="160" cy="210" r="98"/><circle cx="160" cy="210" r="90"/>
    <circle cx="160" cy="210" r="82"/><circle cx="160" cy="210" r="74"/>
    <circle cx="160" cy="210" r="66"/><circle cx="160" cy="210" r="58"/>
  </g>
  <path d="M76 168a104 104 0 0 1 60-58" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.30" fill="none"/>

  <!-- front flange with cut-outs so the coil shows -->
  <circle cx="160" cy="210" r="112" fill="none" stroke="url(#flange)" stroke-width="22"/>
  <circle cx="160" cy="210" r="52" fill="url(#flange)"/>
  <circle cx="160" cy="210" r="26" fill="#5B6C7D"/>
  <circle cx="160" cy="210" r="16" fill="#38485A"/>
  <g fill="#DCE5ED">
    <circle cx="160" cy="128" r="15"/><circle cx="160" cy="292" r="15"/>
    <circle cx="78" cy="210" r="15"/><circle cx="242" cy="210" r="15"/>
  </g>

  <!-- loose strand feeding out -->
  <path d="M262 196c22 10 30 34 18 56-10 18-4 32 14 38" stroke="#37A6CA" stroke-width="7"
        stroke-linecap="round" fill="none"/>

  <text x="160" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        letter-spacing="4" fill="#64748B" text-anchor="middle">PLA+ 1.75</text>
</svg>
