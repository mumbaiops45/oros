<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <defs>
    <linearGradient id="stand" x1="70" y1="220" x2="250" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#94A3B8"/>
      <stop offset="0.5" stop-color="#546174"/>
      <stop offset="1" stop-color="#28303C"/>
    </linearGradient>
    <linearGradient id="screen" x1="118" y1="90" x2="212" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8AE0F4"/>
      <stop offset="1" stop-color="#37A6CA"/>
    </linearGradient>
    <pattern id="layers" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="1.3" fill="#FFFFFF" opacity="0.20"/>
    </pattern>
    <clipPath id="cp"><path d="M92 328l58-142 42 16-44 126z"/></clipPath>
  </defs>

  <ellipse cx="160" cy="348" rx="86" ry="14" fill="#0F172A" opacity="0.10"/>

  <!-- phone resting on the stand -->
  <g transform="rotate(-11 160 190)">
    <rect x="112" y="80" width="98" height="182" rx="14" fill="#1E2733"/>
    <rect x="119" y="88" width="84" height="166" rx="9" fill="url(#screen)"/>
    <rect x="146" y="93" width="30" height="6" rx="3" fill="#1E2733"/>
    <rect x="130" y="120" width="54" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="130" y="136" width="38" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- angled back support -->
  <path d="M92 328l58-142 42 16-44 126z" fill="url(#stand)"/>
  <g clip-path="url(#cp)"><rect x="84" y="180" width="120" height="152" fill="url(#layers)"/></g>

  <!-- front lip + base slab -->
  <path d="M84 300h150l-6 30H90z" fill="#3B4552"/>
  <rect x="70" y="326" width="180" height="22" rx="11" fill="url(#stand)"/>
  <rect x="70" y="326" width="180" height="8" rx="4" fill="#FFFFFF" opacity="0.22"/>
  <rect x="96" y="292" width="112" height="12" rx="6" fill="#28303C" opacity="0.7"/>
  <path d="M118 336h84" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>
