<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop stop-color="#FFF6DA"/>
      <stop offset="0.6" stop-color="#FFD87A"/>
      <stop offset="1" stop-color="#E8A93B"/>
    </radialGradient>
    <linearGradient id="base" x1="104" y1="290" x2="220" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B6674"/>
      <stop offset="1" stop-color="#232B36"/>
    </linearGradient>
    <pattern id="layers" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="1.6" fill="#B07C16" opacity="0.22"/>
    </pattern>
    <clipPath id="cp"><circle cx="160" cy="180" r="86"/></clipPath>
  </defs>

  <ellipse cx="160" cy="350" rx="82" ry="14" fill="#0F172A" opacity="0.10"/>

  <!-- ambient halo -->
  <circle cx="160" cy="180" r="118" fill="#FFD87A" opacity="0.16"/>
  <circle cx="160" cy="180" r="100" fill="#FFD87A" opacity="0.14"/>

  <!-- lithophane globe -->
  <circle cx="160" cy="180" r="86" fill="url(#glow)"/>
  <g clip-path="url(#cp)">
    <rect x="74" y="94" width="172" height="172" fill="url(#layers)"/>
    <!-- carved lithophane relief: mountains + moon -->
    <path d="M74 236l40-52 30 32 34-46 48 66v40H74z" fill="#C98A20" opacity="0.35"/>
    <path d="M74 246l46-40 28 24 40-34 58 50v40H74z" fill="#A96F12" opacity="0.30"/>
    <circle cx="204" cy="132" r="20" fill="#FFFDF3" opacity="0.55"/>
    <circle cx="118" cy="140" r="30" fill="#FFFFFF" opacity="0.28"/>
  </g>
  <circle cx="160" cy="180" r="86" fill="none" stroke="#B07C16" stroke-width="3" opacity="0.35"/>

  <!-- printed stand -->
  <path d="M132 254c8 22 8 36 4 52h48c-4-16-4-30 4-52z" fill="#3B4552"/>
  <path d="M124 300h72l10 30h-92z" fill="url(#base)"/>
  <rect x="104" y="326" width="112" height="20" rx="10" fill="url(#base)"/>
  <rect x="104" y="326" width="112" height="7" rx="3.5" fill="#FFFFFF" opacity="0.20"/>
  <path d="M126 336h68" stroke="#0F172A" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
