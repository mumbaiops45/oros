<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <defs>
    <linearGradient id="shell" x1="58" y1="150" x2="262" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7F08A"/>
      <stop offset="0.5" stop-color="#93C13C"/>
      <stop offset="1" stop-color="#4F7511"/>
    </linearGradient>
    <linearGradient id="lid" x1="58" y1="120" x2="262" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF9C4"/>
      <stop offset="1" stop-color="#A9D257"/>
    </linearGradient>
    <pattern id="layers" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="1.5" fill="#FFFFFF" opacity="0.22"/>
    </pattern>
    <clipPath id="cp"><rect x="58" y="164" width="204" height="150" rx="22"/></clipPath>
  </defs>

  <ellipse cx="160" cy="336" rx="100" ry="14" fill="#0F172A" opacity="0.10"/>

  <!-- lifted lid, floating above -->
  <g transform="translate(0 -14)">
    <rect x="58" y="120" width="204" height="46" rx="20" fill="url(#lid)"/>
    <rect x="58" y="120" width="204" height="16" rx="8" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="96" cy="143" r="6" fill="#5C8A16" opacity="0.6"/>
    <circle cx="224" cy="143" r="6" fill="#5C8A16" opacity="0.6"/>
    <rect x="128" y="136" width="64" height="14" rx="7" fill="#4F7511" opacity="0.35"/>
  </g>

  <!-- body -->
  <rect x="58" y="164" width="204" height="150" rx="22" fill="url(#shell)"/>
  <g clip-path="url(#cp)"><rect x="58" y="158" width="204" height="160" fill="url(#layers)"/></g>

  <!-- board inside -->
  <rect x="84" y="192" width="152" height="76" rx="8" fill="#155E52"/>
  <rect x="96" y="204" width="34" height="26" rx="4" fill="#0B3B34"/>
  <rect x="142" y="206" width="22" height="14" rx="3" fill="#F1C453"/>
  <rect x="176" y="206" width="46" height="10" rx="3" fill="#0B3B34"/>
  <path d="M96 244h128M96 256h96" stroke="#3FBF88" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="216" cy="252" r="6" fill="#3FBF88"/>

  <!-- ports + vents -->
  <rect x="86" y="286" width="42" height="14" rx="4" fill="#3D5C0D"/>
  <rect x="140" y="286" width="26" height="14" rx="4" fill="#3D5C0D"/>
  <path d="M186 288h56M186 296h56" stroke="#3D5C0D" stroke-width="5" stroke-linecap="round"/>
  <rect x="58" y="300" width="204" height="14" rx="7" fill="#3D5C0D" opacity="0.35"/>
</svg>
