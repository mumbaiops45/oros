<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" fill="none">
  <defs>
    <linearGradient id="plate" x1="56" y1="150" x2="266" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC1D2"/>
      <stop offset="0.5" stop-color="#F0578C"/>
      <stop offset="1" stop-color="#A31A4F"/>
    </linearGradient>
    <pattern id="layers" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="1.3" fill="#FFFFFF" opacity="0.24"/>
    </pattern>
    <clipPath id="cp"><rect x="56" y="158" width="212" height="104" rx="26"/></clipPath>
  </defs>

  <ellipse cx="170" cy="300" rx="92" ry="13" fill="#0F172A" opacity="0.10"/>

  <!-- split ring -->
  <circle cx="52" cy="152" r="26" fill="none" stroke="#B8C2CE" stroke-width="9"/>
  <circle cx="52" cy="152" r="26" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"
          stroke-dasharray="30 130" transform="rotate(-40 52 152)"/>

  <!-- name plate -->
  <rect x="56" y="158" width="212" height="104" rx="26" fill="url(#plate)"/>
  <g clip-path="url(#cp)"><rect x="56" y="152" width="212" height="116" fill="url(#layers)"/></g>
  <rect x="66" y="168" width="192" height="84" rx="20" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <circle cx="88" cy="210" r="13" fill="#8E1443" opacity="0.55"/>

  <!-- raised custom lettering -->
  <text x="176" y="222" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700"
        letter-spacing="4" fill="#FFF3F7" text-anchor="middle">AARAV</text>
  <text x="176" y="242" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        letter-spacing="5" fill="#FFD9E5" text-anchor="middle" opacity="0.85">YOUR NAME HERE</text>

  <!-- a second plate peeking behind, showing colour choice -->
  <rect x="98" y="266" width="176" height="30" rx="15" fill="#37A6CA" opacity="0.9"/>
  <rect x="98" y="266" width="176" height="11" rx="5.5" fill="#FFFFFF" opacity="0.3"/>
</svg>
